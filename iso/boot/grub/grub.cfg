set timeout=8
set default=0

insmod all_video
insmod gfxterm
set gfxmode=auto,1920x1080x32,1440x900x32,1280x800x32,1024x768x32
set gfxpayload=keep

menuentry "MyOS 2.1 - Graphical desktop" {
    multiboot /boot/kernel.elf gui
    boot
}
menuentry "MyOS 2.1 - Text shell" {
    multiboot /boot/kernel.elf
    boot
}

submenu "MyOS 2.1 - Display resolution (graphical desktop)" {
    menuentry "Automatic (best for this screen)" {
        set gfxmode=auto
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
    menuentry "1920 x 1080" {
        set gfxmode=1920x1080x32
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
    menuentry "1440 x 900" {
        set gfxmode=1440x900x32
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
    menuentry "1280 x 800" {
        set gfxmode=1280x800x32
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
    menuentry "1280 x 720" {
        set gfxmode=1280x720x32
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
    menuentry "1024 x 768" {
        set gfxmode=1024x768x32
        terminal_output gfxterm
        multiboot /boot/kernel.elf gui
        boot
    }
}

menuentry "MyOS 2.1 - Self test" {
    multiboot /boot/kernel.elf selftest
    boot
}
