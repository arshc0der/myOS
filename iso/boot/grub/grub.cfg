set timeout=8
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1280x800x32,1280x720x32,1024x768x32,auto
set gfxpayload=keep

menuentry "MyOS 2.0 - Graphical desktop" {
    multiboot /boot/kernel.elf gui
    boot
}
menuentry "MyOS 2.0 - Text shell" {
    multiboot /boot/kernel.elf
    boot
}
menuentry "MyOS 2.0 - Self test" {
    multiboot /boot/kernel.elf selftest
    boot
}
