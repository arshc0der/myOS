set timeout=8
set default=0

insmod all_video
insmod gfxterm
set gfxmode=auto,1920x1080x32,1440x900x32,1280x800x32,1024x768x32
set gfxpayload=keep

menuentry "MyOS 2.1 - Graphical desktop" {
    multiboot /boot/kernel.elf gui
    boot
}
menuentry "MyOS 2.1 - Text shell" {
    multiboot /boot/kernel.elf
    boot
}
menuentry "MyOS 2.1 - Self test" {
    multiboot /boot/kernel.elf selftest
    boot
}
